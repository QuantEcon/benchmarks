# Benchmark CI Workflow
# Runs benchmarks on CPU (GitHub Actions) and/or GPU (RunsOn) runners.
# All runs are manual-only via workflow_dispatch.

name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      run_cpu:
        description: 'Run CPU benchmarks (GitHub Actions, free)'
        required: false
        default: true
        type: boolean
      run_gpu:
        description: 'Run GPU benchmarks (RunsOn, incurs costs)'
        required: false
        default: false
        type: boolean
      run_precision:
        description: 'Run precision benchmarks: float32 against float64 on the GPU and its host CPU (RunsOn, incurs costs)'
        required: false
        default: false
        type: boolean
      precision_run:
        description: 'Precision benchmarks: smoke (describe the GPU and driver only), quick sizes, or the full matrix'
        required: false
        default: 'quick'
        type: choice
        options:
          - smoke
          - quick
          - full
      precision_instance:
        description: 'Precision benchmarks: EC2 instance (g4dn: T4, g5: A10G, g6: L4, g7e: RTX PRO 6000 Blackwell, p4d: 8x A100 40 GB, p5: H100)'
        required: false
        default: 'g4dn.2xlarge'
        type: choice
        options:
          - g4dn.2xlarge
          - g5.2xlarge
          - g6.2xlarge
          - g7e.2xlarge
          - p4d.24xlarge
          - p5.4xlarge
      precision_cuda:
        description: "Precision benchmarks: JAX's CUDA build"
        required: false
        default: 'cuda13'
        type: choice
        options:
          - cuda13
          - cuda12
      run_lectures:
        description: 'Run every lecture-jax lecture as written, three times, on the GPU and its host CPU (#4; RunsOn, incurs costs)'
        required: false
        default: false
        type: boolean
      lectures_instance:
        description: "Whole lectures: EC2 instance (g4dn: T4, the lectures' CI instance; g5: A10G; g6: L4)"
        required: false
        default: 'g4dn.2xlarge'
        type: choice
        options:
          - g4dn.2xlarge
          - g5.2xlarge
          - g6.2xlarge
      precision_devices:
        description: 'Precision benchmarks: devices, e.g. cpu,gpu, or gpu,gpu:2 to shard the Bellman workloads over two cards'
        required: false
        default: 'cpu,gpu'
        type: string
      precision_extras:
        description: 'Precision benchmarks: also run matmul at full float32 precision (no TF32), and the aiyagari_jax and ifp_egm_jax scale scripts on the GPU'
        required: false
        default: false
        type: boolean

jobs:
  # =============================================================================
  # CPU Benchmarks - GitHub Actions (free)
  # =============================================================================
  benchmark-cpu:
    name: CPU Benchmarks
    if: inputs.run_cpu == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy numba jax[cpu]

      - name: Run hardware benchmarks
        run: |
          python hardware/benchmark_hardware.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-cpu
          path: benchmark_results_bare_metal.json

  # =============================================================================
  # GPU Benchmarks - RunsOn (pay-per-use)
  # =============================================================================
  benchmark-gpu:
    name: GPU Benchmarks
    if: inputs.run_gpu == true
    runs-on:
      - runs-on
      - runner=gpu
      - image=quantecon-gpu-ubuntu2404
      - run-id=${{ github.run_id }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conda environment
        run: |
          eval "$(conda shell.bash hook)"
          conda activate base
          # JAX with CUDA is pre-installed in the QuantEcon AMI

      - name: Verify GPU
        run: |
          eval "$(conda shell.bash hook)"
          conda activate base
          nvidia-smi
          python -c "import jax; print(f'JAX devices: {jax.devices()}')"

      - name: Run hardware benchmarks
        run: |
          eval "$(conda shell.bash hook)"
          conda activate base
          python hardware/benchmark_hardware.py

      - name: Run lax.scan profiler
        run: |
          eval "$(conda shell.bash hook)"
          conda activate base
          python jax/lax_scan/profile_lax_scan.py --diagnose -n 100000

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-gpu
          path: |
            benchmark_results_bare_metal.json

  # =============================================================================
  # GPU Benchmarks with Nsight Profiling (advanced)
  # =============================================================================
  benchmark-gpu-nsight:
    name: GPU Benchmarks (Nsight)
    if: inputs.run_gpu == true
    runs-on:
      - runs-on
      - runner=gpu
      - image=quantecon-gpu-ubuntu2404
      - run-id=${{ github.run_id }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conda environment
        run: |
          eval "$(conda shell.bash hook)"
          conda activate base

      - name: Install Nsight Systems
        run: |
          # Nsight Systems may be pre-installed on the AMI
          # If not, install from NVIDIA
          which nsys || echo "Nsight not installed"

      - name: Run lax.scan with Nsight profiling
        run: |
          eval "$(conda shell.bash hook)"
          conda activate base
          # Use smaller iteration count for Nsight to keep trace manageable
          nsys profile -o lax_scan_profile --trace=cuda,nvtx \
            python jax/lax_scan/profile_lax_scan.py --nsys -n 1000
        continue-on-error: true  # Don't fail if nsys not available

      - name: Upload Nsight profile
        uses: actions/upload-artifact@v4
        with:
          name: nsight-profile
          path: lax_scan_profile.nsys-rep
        if: always()

  # =============================================================================
  # Precision Benchmarks - float32 against float64, GPU against its host CPU
  # See precision/README.md
  # =============================================================================
  benchmark-precision:
    name: Precision Benchmarks
    if: inputs.run_precision == true
    # The lectures' label form; the image is defined in .github/runs-on.yml
    runs-on: "runs-on=${{ github.run_id }}/family=${{ inputs.precision_instance }}/image=quantecon_ubuntu2404/volume=80gb/spot=false"
    # A cap on spend: p4d.24xlarge bills about USD 22 an hour
    timeout-minutes: 60
    env:
      HOST: runson-${{ inputs.precision_instance }}
      LABEL: ${{ inputs.precision_cuda == 'cuda12' && 'cuda12' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Describe the GPU and its driver
        run: |
          nvidia-smi || true
          nvidia-smi -q | grep -iE "product name|fabric|state|addressing mode" | sort | uniq -c || true
          # "Dual MIT/GPL" is NVIDIA's open kernel module, which Blackwell needs; "NVIDIA" is the proprietary one
          echo "nvidia module: $(modinfo -F version nvidia 2>/dev/null), licence $(modinfo -F license nvidia 2>/dev/null)"
          dpkg-query -W -f '${Package} ${Version}\n' | grep -iE "^(nvidia|libnvidia-nscq|linux-modules-nvidia)" || true
          sudo dmesg | grep -iE "nvrm|nvidia" | tail -20 || true

      - name: Start NVIDIA's fabric manager
        # The A100s in a p4d are joined by NVSwitch, and CUDA won't start until the fabric manager runs
        if: startsWith(inputs.precision_instance, 'p4d')
        run: |
          # The image's driver is from NVIDIA's CUDA repository, which has a fabric manager for each driver release
          version=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1)
          repo=https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64
          for suffix in 1 1ubuntu1; do
            curl -fsSLO "$repo/nvidia-fabricmanager_${version}-${suffix}_amd64.deb" && break
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./nvidia-fabricmanager_"${version}"-*_amd64.deb
          sudo systemctl start nvidia-fabricmanager
          systemctl is-active nvidia-fabricmanager
          nvidia-smi -q | grep -iA2 fabric | head -8

      - name: Install JAX
        run: |
          # The same JAX release as the other platforms (precision/constraints.txt)
          pip install "jax[${{ inputs.precision_cuda }}]" -c precision/constraints.txt
          python -c "import jax; print(f'JAX {jax.__version__}: {jax.devices()}'); assert jax.devices()[0].platform == 'gpu', 'JAX sees no GPU'"
          # How much of the card JAX's allocator will hand out, with preallocation off as in every cell
          limit='import jax; d = jax.devices()[0]; print(d.device_kind, "allocator limit, GiB:", round(d.memory_stats()["bytes_limit"] / 2**30, 2))'
          XLA_PYTHON_CLIENT_PREALLOCATE=false python -c "$limit"
          XLA_PYTHON_CLIENT_PREALLOCATE=false XLA_PYTHON_CLIENT_MEM_FRACTION=0.95 python -c "$limit"

      - name: Run precision matrix
        if: inputs.precision_run != 'smoke'
        run: |
          # Every card in PCI bus order, so that gpu uses the first and gpu:N the first N
          gpus=$(nvidia-smi --query-gpu=index --format=csv,noheader | paste -sd, -)
          python precision/run_matrix.py --host "$HOST" --devices ${{ inputs.precision_devices }} --gpus "$gpus" \
            ${{ inputs.precision_run == 'quick' && '--quick' || '' }} ${LABEL:+--label "$LABEL"}
          if ${{ inputs.precision_extras }}; then
            # Ampere and later run float32 matmul in TF32 by default; this pass turns it off
            JAX_DEFAULT_MATMUL_PRECISION=highest python precision/run_matrix.py --host "$HOST" --devices gpu \
              --workloads matmul ${{ inputs.precision_run == 'quick' && '--quick' || '' }} --label "${LABEL:+$LABEL-}highest"
          fi
          python precision/summarise.py results/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the lecture scale scripts
        if: inputs.precision_run != 'smoke' && inputs.precision_extras
        run: |
          # The lectures as Phase 1 ran them: lecture-jax at 4b939ec
          pip install matplotlib quantecon==0.13.1 -c precision/constraints.txt
          for lecture in aiyagari_jax ifp_egm_jax; do
            curl -fsSL -o "lectures/$lecture/$lecture.md" \
              "https://raw.githubusercontent.com/QuantEcon/lecture-jax/4b939ec49a7f1901245f68749c1b1e18e3454d34/lectures/$lecture.md"
          done
          echo "3ec2c8f04521cc9af6739d3950c2fa61b1bf15913566a5ee1e5019c41808cc95  lectures/aiyagari_jax/aiyagari_jax.md" | sha256sum -c
          out="lectures/results/$HOST/$(date -u +%F)"
          mkdir -p "$out/aiyagari_jax/scale" "$out/ifp_egm_jax/scale"
          export JAX_PLATFORMS=cuda CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=0 XLA_PYTHON_CLIENT_PREALLOCATE=false MPLBACKEND=Agg
          for dtype in float64 float32; do
            timeout 900 python lectures/aiyagari_jax/aiyagari_scale.py lectures/aiyagari_jax/aiyagari_jax.md --dtype $dtype \
              --sizes 200,1000,2000,5000,10000 --out "$out/aiyagari_jax/scale/cuda-$dtype-1.json" || echo "aiyagari_jax $dtype: exit $?"
            timeout 900 python lectures/ifp_egm_jax/ifp_scale.py lectures/ifp_egm_jax/ifp_egm_jax.md --dtype $dtype \
              --sizes 200,1000,5000,20000,50000 --out "$out/ifp_egm_jax/scale/cuda-$dtype-1.json" || echo "ifp_egm_jax $dtype: exit $?"
          done
          pip freeze > "$out/environment.txt"
          python lectures/aiyagari_jax/summarise_scale.py "$out"/aiyagari_jax/scale/*.json | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Run five lectures as written
        if: inputs.precision_run != 'smoke' && inputs.precision_extras
        run: |
          # The five lectures with the most GPU work in #4's set, as written, three times each on the
          # card, with the TITAN RTX run's packages; precision/run_by_hand.sh does the same off RunsOn
          lectures="overborrowing wealth_dynamics_jax schelling_shocks opt_invest hopenhayn"; reps=3
          ${{ inputs.precision_run == 'quick' && 'lectures=schelling_shocks; reps=1' || '' }}
          grep -vE '^(jax|jaxlib|jax-cuda[0-9]+-(plugin|pjrt)|nvidia-[a-z0-9-]+)==' \
            lectures/results/qe-wharton1-gpu/2026-10-25/whole/environment.txt > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt" -c precision/constraints.txt
          for lecture in $lectures; do
            curl -fsSL -o "$RUNNER_TEMP/$lecture.md" \
              "https://raw.githubusercontent.com/QuantEcon/lecture-jax/4b939ec49a7f1901245f68749c1b1e18e3454d34/lectures/$lecture.md"
          done
          out="lectures/results/$HOST/$(date -u +%F)/whole"
          mkdir -p "$out"
          export CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=0 MPLBACKEND=Agg
          for rep in $(seq 1 $reps); do
            for lecture in $lectures; do
              mkdir -p "$out/$lecture"
              JAX_PLATFORMS=cuda timeout 3600 python lectures/run_lecture.py "$RUNNER_TEMP/$lecture.md" --dtype as-written \
                --out "$out/$lecture/cuda-as-written-$rep.json" --env-info precision \
                > /dev/null 2> "$out/$lecture/cuda-$rep.err" && rm -f "$out/$lecture/cuda-$rep.err" \
                || echo "$lecture rep $rep: exit $?"
              python -c "import json,sys; r=json.load(open(sys.argv[1])); print(f\"$lecture rep $rep: {r['lecture_s']:.1f} s, cells ok {r['all_ok']}, {r['default_float']}\")" \
                "$out/$lecture/cuda-as-written-$rep.json" 2>/dev/null || echo "$lecture rep $rep: no result"
            done
          done | tee "$out/lectures-set.log"
          pip freeze > "$out/environment.txt"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-precision-${{ inputs.precision_instance }}-${{ inputs.precision_cuda }}
          path: |
            results/runson-*/
            lectures/results/runson-*/

  # =============================================================================
  # Whole lectures, as used - every lecture-jax lecture on the GPU and its host CPU
  # See lectures/whole/README.md
  # =============================================================================
  benchmark-lectures:
    name: Whole Lectures
    if: inputs.run_lectures == true
    runs-on: "runs-on=${{ github.run_id }}/family=${{ inputs.lectures_instance }}/image=quantecon_ubuntu2404/volume=80gb/spot=false"
    # Three runs take about 3.5 hours on a g4dn.2xlarge (USD 0.75 an hour); this caps the cost
    timeout-minutes: 300
    env:
      HOST: runson-${{ inputs.lectures_instance }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the TITAN RTX run's packages
        run: |
          # The exact versions qe-wharton1-gpu ran with, so that the two compare
          pip install -r lectures/results/qe-wharton1-gpu/2026-10-25/whole/environment.txt
          nvidia-smi
          python -c "import jax; print(f'JAX {jax.__version__}: {jax.devices()}'); assert jax.devices()[0].platform == 'gpu', 'JAX sees no GPU'"

      - name: Fetch the lectures
        run: |
          # lecture-jax at 4b939ec, as on the other machines
          mkdir -p "$RUNNER_TEMP/lectures-all/lectures"
          cp lectures/whole/lectures.txt "$RUNNER_TEMP/lectures-all/"
          for lecture in $(cat lectures/whole/lectures.txt); do
            curl -fsSL -o "$RUNNER_TEMP/lectures-all/lectures/$lecture.md" \
              "https://raw.githubusercontent.com/QuantEcon/lecture-jax/4b939ec49a7f1901245f68749c1b1e18e3454d34/lectures/$lecture.md"
          done

      - name: Run every lecture
        run: |
          out="$GITHUB_WORKSPACE/lectures/results/$HOST/$(date -u +%F)/whole"
          mkdir -p "$out"
          pip freeze > "$out/environment.txt"
          ROOT="$RUNNER_TEMP/lectures-all" PY="$(which python)" RUNNER="$GITHUB_WORKSPACE/lectures/run_lecture.py" \
            ENV_INFO="$GITHUB_WORKSPACE/precision" bash lectures/whole/lectures_set.sh "$out" 3 cuda cpu | tee "$out/lectures-set.log"
          find "$out" -name '*.err' -empty -delete
          python lectures/whole/summarise_whole.py "$out" --lectures "$RUNNER_TEMP/lectures-all/lectures" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-lectures-${{ inputs.lectures_instance }}
          path: lectures/results/runson-*/
